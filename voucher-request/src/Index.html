<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <?!= include('Css base') ?>
</head>
<body>
<div id="bootScreen" class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="text-center text-muted">
    <div class="spinner-border text-success mb-2"></div>
    <div class="small">Loading...</div>
  </div>
</div>
<!-- ---------- Login screen ---------- -->
<section id="loginScreen" class="auth-gate d-none">
  <div class="auth-blob" style="width:480px;height:480px;background:#a8dfa8;top:-140px;left:-140px;"></div>
  <div class="auth-blob" style="width:360px;height:360px;background:#78ca78;bottom:-90px;right:-90px;"></div>

  <div class="auth-card" id="loginCard">
    <div class="auth-logo-wrap">
      <img src="https://lh3.googleusercontent.com/u/0/d/18eRw-6rMaaVYJhxR7ZR7-m-BIy6VujDl" class="auth-logo" alt="Logo" referrerpolicy="no-referrer" onerror="this.style.display='none'">
    </div>

    <h1 class="auth-title">Voucher Request</h1>
    <p class="auth-sub"><strong>Aklan Provincial Health Office</strong></p>

    <form onsubmit="event.preventDefault(); doLogin();" novalidate>
      <div class="mb-3">
        <label class="auth-label" for="lgUser"><i class="bi bi-person me-1"></i>Username</label>
        <input class="form-control" id="lgUser" type="text" placeholder="Enter username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>

      <div class="mb-3">
        <label class="auth-label" for="lgPass"><i class="bi bi-lock me-1"></i>Password</label>
        <div class="input-group">
          <input class="form-control" id="lgPass" type="password" placeholder="Enter password" autocomplete="current-password" required>
          <button class="auth-eye" id="pwToggle" type="button" tabindex="-1" aria-label="Show or hide password" onclick="togglePw()">
            <i class="bi bi-eye" id="eyeIco"></i>
          </button>
        </div>
        <div class="caps-hint d-none" id="capsHint">Caps Lock is on</div>
      </div>

      <button class="auth-signin" id="lgBtn" type="submit">
        <span class="spinner-border spinner-border-sm me-2 d-none" id="lgSpin"></span><span id="lgBtnText">Sign in</span>
      </button>
    </form>

    <p id="lgError" class="auth-message d-none" role="alert" aria-live="polite"></p>
  </div>

  <div class="auth-waves">
    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(168,223,168,0.3)"/>
        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(168,223,168,0.5)"/>
        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(168,223,168,0.7)"/>
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#a8dfa8"/>
      </g>
    </svg>
  </div>
</section>

<!-- ---------- App screen ---------- -->
<div id="app" class="shell d-none">
  <nav class="side">
    <div class="brand">Voucher Request<small>Provincial Health Office</small></div>

  <div class="grp">Analytics</div>
  <button class="nav-btn active" id="navDash" onclick="showView('dash')"><i class="bi bi-bar-chart-line"></i><span>Dashboard</span></button>

  <div class="grp">Modules</div>
  <button class="nav-btn" id="navObr" onclick="showView('obr')"><i class="bi bi-file-earmark-text"></i><span>OBR</span></button>

  <div id="adminNav" class="d-none">
    <div class="grp">Admin</div>
    <button class="nav-btn" id="navUsers" onclick="showView('users')"><i class="bi bi-people"></i><span>Users</span></button>
  </div>

<div class="side-account">
  <div class="who">
    <div class="who-avatar" id="whoAvatar">?</div>
    <div>
      <div class="who-name" id="whoName"></div>
    </div>
  </div>
<button class="nav-btn logout" onclick="confirmLogout()"><i class="bi bi-box-arrow-right"></i><span>Sign out</span></button>
</div>
  </nav>

  <main class="main">
    <?!= include('Obr view') ?>
    <?!= include('Dash view') ?>
    <?!= include('Users view') ?>

    <!-- Particulars modal (unchanged) -->
    <div class="modal fade" id="partModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="partTitle">Particulars</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="dv-info mb-3"><strong>Payee: </strong><span id="partPayee"></span></div>
            <div id="partBody"></div>
            <div class="d-flex justify-content-between gap-3 pt-2 mt-2 border-top">
              <strong>Total</strong><strong id="partTotal"></strong>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Print layouts (must stay outside #app) -->

<div id="printAi"></div>

  function bootApp() {
    showView('dash');
    loadList();
    loadLookups();
    loadDefaults();
  }
  restoreSession();
</script>
</body>
</html>
